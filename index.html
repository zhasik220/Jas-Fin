<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jas Fin">
<title>Jas Fin</title>
<style>
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
:root{--bar:#5b6cff;--bg:#f3f5fb;--card:#fff;--tx:#1b2033;--mu:#7a8199;--ac:#5b6cff;--ln:#e6e9f4;--ok:#1fa76a;--bad:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#0f1220;--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mu:#8b92b0;--ln:#2a2f4a;color-scheme:dark}}
:root[data-theme="dark"]{--bar:#0f1220;--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mu:#8b92b0;--ln:#2a2f4a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
.w{max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top h1{font-size:22px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.ib{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(30,40,90,.06)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:10px;cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.nav b{text-transform:capitalize}
.nav button{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.bal{background:linear-gradient(135deg,#5b6cff,#8a5bff);color:#fff}
.bal small{opacity:.8}
.big{font-size:30px;font-weight:700;margin:2px 0 10px}
.row3{display:flex;gap:10px}.row3>div{flex:1}
.mu{color:var(--mu)}.g{color:var(--ok)}.r{color:var(--bad)}
.legend{display:flex;align-items:center;gap:8px;margin-top:6px}
.dot{width:10px;height:10px;border-radius:50%}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.tx:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.tx .m{flex:1;min-width:0}.tx .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer;padding:8px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:4px}.chips button{flex:none;border:1px solid var(--ln);background:none;border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--mu)}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(91,108,255,.5);cursor:pointer}
#bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#sh{display:none;position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#sh h2{margin:0 0 10px;font-size:18px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);margin:4px 0 10px}
.pb{width:100%;border:0;background:var(--ac);color:#fff;padding:13px;border-radius:14px;font-weight:600;cursor:pointer;margin-top:4px}
.sb{width:100%;border:1px solid var(--ln);background:var(--bg);padding:11px;border-radius:12px;cursor:pointer;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tg{border:2px solid transparent;background:var(--bg);border-radius:14px;padding:8px 2px;text-align:center;cursor:pointer;font-size:12px}
.tg.on{border-color:var(--ac)}.tg .ic{margin:0 auto 3px}
.em{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-height:170px;overflow:auto;background:var(--bg);border-radius:12px;padding:6px;margin-bottom:10px}
.em button{border:0;background:none;font-size:22px;padding:4px;border-radius:8px;cursor:pointer}.em button.on{background:var(--ac)}
.lbl{font-size:13px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{border:1px solid var(--ln);background:none;border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--mu)}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:16px 0}
</style>
</head>
<body>
<div class="w" id="app"></div>
<button class="fab" onclick="newTx()">+</button>
<div id="bg" onclick="closeS()"></div>
<div id="sh"></div>
<script>
var $=function(s){return document.querySelector(s)};
var pad=function(n){return n<10?'0'+n:''+n};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var DEF=[['🍔','Еда','#ff8a3d'],['⛽','Бензин','#e5484d'],['🛒','Магазин','#2bb673'],['🚌','Транспорт','#3d8bff'],['🏠','Жильё','#8a5bff'],['🎮','Развлечения','#ff5fa2']];
function init(){return{cur:'₸',tags:DEF.map(function(d){return{id:uid(),i:d[0],n:d[1],c:d[2],img:''}}),tx:[],sal:{on:false,amt:0,day:1,last:''},per:{m:'month',off:0,f:'',t:''},ch:'pie'}}
var S;try{var r=localStorage.getItem('jasfin');S=r?JSON.parse(r):init()}catch(e){S=init()}
function save(){try{localStorage.setItem('jasfin',JSON.stringify(S))}catch(e){}}
function applySal(){var s=S.sal;if(!s.on||!(s.amt>0))return;var n=new Date(),cur=n.getFullYear()*12+n.getMonth();var st=s.last?(+s.last.slice(0,4))*12+(+s.last.slice(5)):cur;for(var k=st;k<=cur;k++){var y=Math.floor(k/12),m=k%12,dim=new Date(y,m+1,0).getDate(),d=new Date(y,m,Math.min(s.day,dim));if(d<=n){S.tx.push({id:uid(),t:'i',a:+s.amt,d:iso(d),note:'Зарплата'});s.last=y+'-'+pad(m+1)}}save()}
function money(v){return Math.round(v).toLocaleString('ru-RU')+' '+S.cur}
function tagOf(id){return S.tags.filter(function(t){return t.id===id})[0]||{i:'❔',n:'Без тега',c:'#999',img:''}}
function icon(t,bg){return'<div class="ic" style="background:'+(bg||t.c+'33')+'">'+(t.img?'<img src="'+t.img+'">':esc(t.i))+'</div>'}
function range(){var p=S.per,n=new Date();if(p.m==='month'){var d=new Date(n.getFullYear(),n.getMonth()+p.off,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);return[iso(d),iso(e),d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})]}
if(p.m==='week'){var dw=(n.getDay()+6)%7,s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dw+7*p.off),e2=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6),f=function(x){return x.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})};return[iso(s),iso(e2),f(s)+' – '+f(e2)]}
return[p.f||iso(n),p.t||iso(n),'Свой период']}
function setM(m){S.per.m=m;S.per.off=0;save();render()}
function mv(k){S.per.off+=k;save();render()}
function setC(c){S.ch=c;save();render()}
function chart(L,exp){var by={};L.filter(function(x){return x.t==='e'}).forEach(function(x){by[x.tag]=(by[x.tag]||0)+x.a});var arr=Object.keys(by).map(function(k){return{t:tagOf(k),v:by[k]}}).sort(function(a,b){return b.v-a.v});if(!arr.length)return'<div class="empty">Пока нет расходов за период</div>';var h='';
if(S.ch==='pie'){var off=25,sv='<svg viewBox="0 0 42 42" style="width:190px;display:block;margin:0 auto"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bg)" stroke-width="5"/>';arr.forEach(function(a){var p=a.v/exp*100;sv+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+a.t.c+'" stroke-width="5" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p});sv+='<text x="21" y="22.5" text-anchor="middle" font-size="4" fill="currentColor" font-weight="700">'+Math.round(exp).toLocaleString('ru-RU')+'</text></svg>';h=sv;arr.forEach(function(a){h+='<div class="legend"><span class="dot" style="background:'+a.t.c+'"></span><span style="flex:1">'+esc(a.t.n)+'</span><b>'+Math.round(a.v/exp*100)+'%</b><span class="mu">'+money(a.v)+'</span></div>'})}
else if(S.ch==='bar'){arr.forEach(function(a){var p=a.v/arr[0].v*100;h+='<div style="display:flex;justify-content:space-between"><span>'+esc(a.t.i)+' '+esc(a.t.n)+'</span><b>'+money(a.v)+'</b></div><div class="bar"><i style="width:'+p+'%;background:'+a.t.c+'"></i></div>'})}
else{var rg=range(),d=new Date(rg[0]+'T00:00'),e=new Date(rg[1]+'T00:00'),pts=[],mx=1;while(d<=e&&pts.length<400){var k=iso(d),v=0;L.forEach(function(x){if(x.t==='e'&&x.d===k)v+=x.a});pts.push(v);if(v>mx)mx=v;d.setDate(d.getDate()+1)}
var n=pts.length,pl=pts.map(function(v,i){return(n>1?i/(n-1)*300:150)+','+(110-v/mx*100)}).join(' ');h='<svg viewBox="0 0 300 120" style="width:100%"><polyline points="'+pl+'" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="mu" style="display:flex;justify-content:space-between"><span>'+rg[0].slice(5)+'</span><span>макс. '+money(mx)+'</span><span>'+rg[1].slice(5)+'</span></div>'}
return h}
function render(){var rg=range(),f=rg[0],t=rg[1],L=S.tx.filter(function(x){return x.d>=f&&x.d<=t}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0}),inc=0,exp=0;L.forEach(function(x){if(x.t==='i')inc+=x.a;else exp+=x.a});var td=iso(new Date()),tod=0;S.tx.forEach(function(x){if(x.t==='e'&&x.d===td)tod+=x.a});var p=S.per,h='<div class="top"><h1>💰 Jas Fin</h1><button class="ib" onclick="setSheet()">⚙️</button></div>';
h+='<div class="seg">'+[['month','Месяц'],['week','Неделя'],['custom','Свой']].map(function(m){return'<button class="'+(p.m===m[0]?'on':'')+'" onclick="setM(\''+m[0]+'\')">'+m[1]+'</button>'}).join('')+'</div>';
if(p.m==='custom')h+='<div class="row3"><input type="date" value="'+f+'" onchange="S.per.f=this.value;save();render()"><input type="date" value="'+t+'" onchange="S.per.t=this.value;save();render()"></div>';else h+='<div class="nav"><button onclick="mv(-1)">‹</button><b>'+rg[2]+'</b><button onclick="mv(1)">›</button></div>';
var bl=inc-exp;h+='<div class="card bal"><small>Баланс</small><div class="big">'+(bl<0?'−':'')+money(Math.abs(bl))+'</div><div class="row3"><div><small>Доход</small><div><b>+'+money(inc)+'</b></div></div><div><small>Расход</small><div><b>−'+money(exp)+'</b></div></div></div></div>';
h+='<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mu">Траты сегодня</div><b style="font-size:22px">'+money(tod)+'</b></div><div style="font-size:30px">📅</div></div>';
h+='<div class="card"><div class="tabs">'+[['pie','Круг'],['bar','Столбцы'],['line','Линия']].map(function(c){return'<button class="'+(S.ch===c[0]?'on':'')+'" onclick="setC(\''+c[0]+'\')">'+c[1]+'</button>'}).join('')+'</div>'+chart(L,exp)+'</div>';
var fl=S.fl||'',LF=L.filter(function(x){return!fl||(fl==='_i'?x.t==='i':x.t==='e'&&x.tag===fl)}),fs=0;LF.forEach(function(x){fs+=x.t==='i'?x.a:-x.a});h+='<div class="card"><b>Операции</b><div class="chips">'+chip('','Все')+S.tags.map(function(t){return chip(t.id,t.i+' '+t.n)}).join('')+chip('_i','💰 Доходы')+'</div>'+(fl?'<div class="mu" style="margin-bottom:4px">Итого: '+(fs<0?'−':'+')+money(Math.abs(fs))+'</div>':'');if(!LF.length)h+='<div class="empty">'+(L.length?'По этому фильтру ничего нет':'Нажмите «+», чтобы добавить первую запись')+'</div>';LF.slice(0,80).forEach(function(x){var g=x.t==='i',tg=g?{i:'💰',c:'#1fa76a',img:''}:tagOf(x.tag);h+='<div class="tx" style="cursor:pointer" onclick="editTx(\''+x.id+'\')">'+icon(tg)+'<div class="m"><div>'+esc(g?(x.note||'Доход'):tagOf(x.tag).n)+'</div><div class="mu" style="font-size:12px">'+x.d.split('-').reverse().join('.')+(!g&&x.note?' · '+esc(x.note):'')+'</div></div><b class="'+(g?'g':'')+'">'+(g?'+':'−')+money(x.a)+'</b><button class="x" onclick="event.stopPropagation();askDel(\''+x.id+'\')">×</button></div>'});h+='</div>';$('#app').innerHTML=h}
function chip(id,l){return'<button class="'+((S.fl||'')===id?'on':'')+'" onclick="S.fl=\''+id+'\';save();render()">'+esc(l)+'</button>'}
function askDel(id){var x=S.tx.filter(function(y){return y.id===id})[0];if(!x)return;var g=x.t==='i';openS('<h2>Удалить запись?</h2><div class="tx">'+icon(g?{i:'💰',c:'#1fa76a',img:''}:tagOf(x.tag))+'<div class="m"><div>'+esc(g?(x.note||'Доход'):tagOf(x.tag).n)+'</div><div class="mu" style="font-size:12px">'+x.d.split('-').reverse().join('.')+'</div></div><b>'+(g?'+':'−')+money(x.a)+'</b></div><button class="pb" style="background:var(--bad)" onclick="del(\''+id+'\')">Удалить</button><button class="sb" onclick="closeS()">Отмена</button>')}
function del(id){S.tx=S.tx.filter(function(x){return x.id!==id});save();closeS();render()}
function newTx(){A.id='';A.a='';A.n='';A.d='';addSheet()}
function editTx(id){var x=S.tx.filter(function(y){return y.id===id})[0];if(!x)return;A={id:x.id,t:x.t,tag:x.tag||null,a:String(x.a),d:x.d,n:x.note||''};addSheet()}
function openS(h){$('#sh').innerHTML=h;$('#sh').style.display='block';$('#bg').style.display='block'}
function closeS(){$('#sh').style.display='none';$('#bg').style.display='none'}
var A={id:'',t:'e',tag:null,a:'',d:'',n:''};
function addSheet(){if(!A.d)A.d=iso(new Date());var h='<h2>'+(A.id?'Редактировать запись':'Новая запись')+'</h2><div class="seg"><button class="'+(A.t==='e'?'on':'')+'" onclick="A.t=\'e\';addSheet()">Расход</button><button class="'+(A.t==='i'?'on':'')+'" onclick="A.t=\'i\';addSheet()">Доход</button></div><input type="number" inputmode="decimal" placeholder="Сумма, '+S.cur+'" value="'+A.a+'" oninput="A.a=this.value">';
if(A.t==='e'){h+='<div class="lbl">Тег</div><div class="grid">'+S.tags.map(function(t){return'<div class="tg '+(A.tag===t.id?'on':'')+'" onclick="A.tag=\''+t.id+'\';addSheet()">'+icon(t)+esc(t.n)+'</div>'}).join('')+'<div class="tg" onclick="tagSheet()"><div class="ic" style="background:var(--bg)">＋</div>Свой</div></div>'}
h+='<input type="date" value="'+A.d+'" onchange="A.d=this.value"><input type="text" placeholder="'+(A.t==='e'?'Заметка (необязательно)':'Название, например: подработка')+'" value="'+esc(A.n)+'" oninput="A.n=this.value"><button class="pb" onclick="saveTx()">Сохранить</button>';openS(h)}
function saveTx(){var a=parseFloat(A.a);if(!(a>0)){alert('Введите сумму');return}if(A.t==='e'&&!A.tag){alert('Выберите тег');return}var rec={id:A.id||uid(),t:A.t,a:a,tag:A.t==='e'?A.tag:'',d:A.d||iso(new Date()),note:A.n.trim()};if(A.id)S.tx=S.tx.map(function(x){return x.id===A.id?rec:x});else S.tx.push(rec);A.id='';A.a='';A.n='';A.d='';save();closeS();render()}
var T={i:'🏷️',c:'#5b6cff',img:'',n:''};
function emojiList(){var a=[];[[0x1F600,0x1F64F],[0x1F300,0x1F5FF],[0x1F680,0x1F6FF],[0x1F900,0x1F9FF],[0x2600,0x26FF]].forEach(function(r){for(var c=r[0];c<=r[1];c++)a.push(String.fromCodePoint(c))});return a}
function tagSheet(){var h='<h2>Теги</h2>'+S.tags.map(function(t){return'<div class="tx">'+icon(t)+'<div class="m">'+esc(t.n)+'</div><button class="x" onclick="delTag(\''+t.id+'\')">×</button></div>'}).join('')+'<h2 style="margin-top:14px">Новый тег</h2><input type="text" placeholder="Название" value="'+esc(T.n)+'" oninput="T.n=this.value"><div class="lbl">Иконка '+(T.img?'(своя картинка)':esc(T.i))+'</div><div class="em">'+emojiList().map(function(e){return'<button class="'+(!T.img&&T.i===e?'on':'')+'" onclick="T.i=\''+e+'\';T.img=\'\';tagSheet()">'+e+'</button>'}).join('')+'</div><button class="sb" onclick="$(\'#fi\').click()">📷 Загрузить свою иконку</button><input id="fi" type="file" accept="image/*" style="display:none" onchange="pickImg(this)"><div class="lbl" style="margin-top:10px">Цвет</div><input type="color" value="'+T.c+'" oninput="T.c=this.value" style="width:100%;height:42px;border:0;background:none"><button class="pb" onclick="addTag()">Добавить тег</button><button class="sb" onclick="addSheet()">← Назад</button>';openS(h)}
function pickImg(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,64,64);T.img=c.toDataURL('image/jpeg',.8);tagSheet()};im.src=r.result};r.readAsDataURL(f)}
function addTag(){if(!T.n.trim()){alert('Введите название');return}var t={id:uid(),i:T.i,n:T.n.trim(),c:T.c,img:T.img};S.tags.push(t);A.tag=t.id;T={i:'🏷️',c:'#5b6cff',img:'',n:''};save();addSheet()}
function delTag(id){S.tags=S.tags.filter(function(t){return t.id!==id});if(A.tag===id)A.tag=null;save();tagSheet();render()}
function setSheet(){var s=S.sal,cs=['₸','$','€','₽','£','¥','₴','сом'];var h='<h2>Настройки</h2><div class="lbl">Валюта по умолчанию</div><select onchange="S.cur=this.value;save();render()">'+cs.map(function(c){return'<option'+(S.cur===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select><h2 style="margin-top:8px">Зарплата</h2><label><input type="checkbox" '+(s.on?'checked':'')+' onchange="S.sal.on=this.checked;save()"> Начислять автоматически каждый месяц</label><div class="lbl" style="margin-top:8px">Сумма</div><input type="number" inputmode="decimal" value="'+(s.amt||'')+'" oninput="S.sal.amt=parseFloat(this.value)||0;save()"><div class="lbl">День месяца (1–31)</div><input type="number" min="1" max="31" value="'+s.day+'" oninput="S.sal.day=Math.min(31,Math.max(1,parseInt(this.value)||1));save()"><button class="pb" onclick="applySal();closeS();render()">Применить</button><h2 style="margin-top:16px">Резервная копия</h2><div class="lbl">Скопируйте текст и сохраните в заметках. Для восстановления вставьте его сюда и нажмите «Загрузить».</div><textarea id="bk" rows="4">'+esc(JSON.stringify(S))+'</textarea><button class="sb" onclick="var b=$(\'#bk\');b.select();try{navigator.clipboard.writeText(b.value)}catch(e){document.execCommand(\'copy\')}">Копировать</button><button class="sb" onclick="impBk()">Загрузить из поля</button><button class="sb" onclick="var r=document.documentElement;var d=r.dataset.theme===\'dark\';r.dataset.theme=d?\'light\':\'dark\'">🌗 Светлая / тёмная тема</button>';openS(h)}
function impBk(){try{var o=JSON.parse($('#bk').value);if(!o.tx||!o.tags)throw 0;S=o;save();closeS();render()}catch(e){alert('Неверный формат копии')}}
applySal();render();
</script>
